server:
  port: 8081
spring:
  r2dbc:
    host: localhost
    port: 5432
    username: 
    password: 
    database: ReactiveDB
    liquibase:
      enabled: true
      change-log: classpath:/db/changelog/db.changelog-master.yaml
  application:
    name: "Authetication"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8081"
postgresql:
  host: localhost
  port: 5432
  database: ReactiveDB
  username: 
  password: 
logging:
  level:
    org.springframework.data.r2dbc: DEBUG
    org.springframework.data.repository: DEBUG
